<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña - Power Girls</title>

    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <main class="login-container">

        <section class="login-box">

            <h1>Power Girls</h1>
            <h2>Recuperar contraseña</h2>

            <p>Ingresa el correo con el que te registraste y te enviaremos el PIN de recuperacion de 6 digitos.</p>

            <form>

                <label for="correo">Correo electrónico</label>

                <input 
                    type="email"
                    id="correo"
                    name="correo"
                    placeholder="Ingresa tu correo"
                >

                <button type="submit">Obtener código</button>

            </form>

            <a href="index.html">Volver al inicio de sesión</a>

        </section>

    </main>

    <script src="js/script.js"></script>

</body>
</html>

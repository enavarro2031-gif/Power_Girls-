<!DOCTYPE html>

</head>

<body>

    <main class="login-container">

            <h1>Power Girls</h1>
            <h2>Mis medidas</h2>

            <form>

               <label for="peso">Peso (kg)</label>
<input 
    type="number"
    id="peso"
    name="peso"
    placeholder="Ingresa tu peso"
>

<label for="cintura">Cintura (cm)</label>
<input 
    type="number"
    id="cintura"
    name="cintura"
    placeholder="Ingresa tu medida"
>

<input 
    type="number"
    id="cadera"
    name="cadera"

>

    type="date"
    id="fecha"
    name="fecha"
>

                <button type="submit">Guardar medidas</button>

            <a href="panel-usuaria.html">Volver al menú principal</a>
